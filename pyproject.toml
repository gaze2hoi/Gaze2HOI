[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze2hoi"
version = "0.1.0"
description = "Gaze-aware intention inference and egocentric hand-object interaction forecasting."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Gaze2HOI Authors"}]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy>=1.26,<2",
  "Pillow>=10",
  "scipy>=1.11",
  "torch>=2.5",
  "smplx==0.1.28",
  "trimesh>=4.0",
]

[project.optional-dependencies]
intention = [
  "torchvision==0.25.0",
  "transformers==4.57.6",
  "peft==0.19.1",
  "accelerate==1.13.0",
  "xgrammar==0.1.29",
  "safetensors>=0.7",
]
render = ["pyrender==0.1.45", "opencv-python-headless>=4.8,<4.12"]
download = ["huggingface-hub>=0.36,<1"]
dev = ["pytest>=8", "ruff==0.17.1", "build>=1.2"]

[project.scripts]
gaze2hoi = "gaze2hoi.cli:main"

[project.urls]
Homepage = "https://gaze2hoi.github.io/"
Repository = "https://github.com/gaze2hoi/Gaze2HOI"
Issues = "https://github.com/gaze2hoi/Gaze2HOI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaze2hoi = ["web/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
